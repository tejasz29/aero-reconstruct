# Single-pass drone video -> 3D reconstruction (offline MVP).
# Makes `src` an importable package and exposes the `sp3d` CLI.
# Full dependency set lives in requirements.txt / environment.yml.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-pass-3d"
version = "0.1.0"
description = "Single-pass drone video to AI 3D reconstruction system (offline MVP)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pyyaml>=6.0.0",
]

[project.scripts]
sp3d = "src.cli:main"

[tool.setuptools]
package-dir = { "" = "." }
packages = { find = { where = ["."], include = ["src*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
