# ============================================================
# single-pass-3d — master pipeline configuration (offline MVP)
# Keep ALL tunable values here. Do NOT hard-code them in src/.
# Stages not yet implemented still get their section now so that
# later steps only fill in code, never restructure config.
# Load with:  src.common.config_loader.load_config()
# ============================================================

project:
  name: "single-pass-3d"
  version: "0.1.0"
  seed: 42

paths:
  raw_videos: "data/raw_videos"
  frames: "data/frames"
  gps: "data/gps"
  imu: "data/imu"
  reference: "data/reference"
  calibration: "calibration"
  models_depth: "models/depth"
  models_segmentation: "models/segmentation"
  outputs: "outputs"

# --- STEP 2/3: video preprocessing + keyframe selection ---
video:
  target_fps: 2.0            # max frames/sec to extract; higher = denser but slower
  max_frames: 2000
  image_max_width: 1920      # downscale wider frames (speed vs detail trade-off)
  output_format: "jpg"       # jpg | png
  jpeg_quality: 95
  quality:
    detector: "orb"          # orb (fast) | sift (slower, denser)
    blur_threshold: 100.0    # Laplacian variance below this = blurry, reject
    min_exposure_mean: 15.0  # mean gray below this = too dark, reject
    max_exposure_mean: 240.0 # mean gray above this = saturated, reject
    min_features: 300        # frames with fewer good features are rejected
  keyframes:
    min_time_gap_s: 0.5
    dedup_hamming_threshold: 5  # dHash bits; lower = stricter duplicate removal
    min_translation_m: 1.0   # approx., enforced from STEP 8 (needs metric scale)
    max_keep: 600

# --- STEP 4: camera calibration ---
calibration:
  source: "provided"         # provided | checkerboard | charuco
  file: "calibration/camera.yaml"
  checkerboard: { rows: 6, cols: 9, square_size_m: 0.025 }
  charuco: { rows: 5, cols: 7, square_size_m: 0.04, marker_size_m: 0.02 }

# --- STEP 5: SfM / pose estimation ---
sfm:
  backend: "colmap"          # colmap baseline; opencv utilities in src/sfm
  feature: "sift"            # sift | orb
  max_features: 8000
  matcher_ratio_test: 0.8
  ransac_reproj_threshold_px: 4.0
  max_reprojection_error_px: 2.0   # poses worse than this are rejected

# --- STEP 7: GPS metric conversion ---
gps:
  input_format: "csv"        # csv with columns: timestamp,latitude,longitude,altitude
  local_crs: "enu"           # enu for small scenes | utm for larger scenes
  utm_zone: "auto"

# --- STEP 8: visual <-> GPS similarity alignment  Xg = s*R*Xv + t ---
alignment:
  ransac_iterations: 1000
  inlier_threshold_m: 2.0
  min_correspondences: 6
  use_rtk_if_available: true

# --- STEP 9: learned monocular depth ---
depth:
  model: "depth-anything-v2" # HF model id / local ckpt under models/depth
  device: "auto"             # auto | cuda | cpu
  input_size: 518
  store_confidence: true
  metric_constraint: "gps_scale"  # monocular depth is NOT metric by itself

# --- STEP 13: dynamic-object segmentation (runs BEFORE fusion) ---
segmentation:
  model: "yolo-seg"          # yolo-seg | sam2
  device: "auto"
  mask_classes: ["person", "car", "truck", "bus", "motorcycle", "bicycle"]
  confidence: 0.35

# --- STEP 10/12: fusion + filtering ---
fusion:
  voxel_size_m: 0.10
  statistical_nb_neighbors: 20
  statistical_std_ratio: 2.0
  radius_nb_points: 8
  radius_m: 0.30
  estimate_normals: true

# --- STEP 14: meshing (Open3D Poisson baseline) ---
mesh:
  method: "poisson"
  poisson_depth: 9
  density_quantile_cutoff: 0.05  # drop low-density verts; keep gaps, don't invent geometry
  formats: ["ply", "obj", "glb"]

# --- STEP 15: texture mapping ---
texture:
  prefer: ["sharpness", "angle", "distance", "exposure"]
  blend_overlaps: true

# --- STEP 16: georeferencing ---
georef:
  output_crs: "auto"         # auto | enu | utm:<zone>
  write_world_file: true
  dsm_resolution_m: 0.25

# --- STEP 17: evaluation ---
evaluation:
  reference_dir: "data/reference"
  completeness_voxel_m: 0.25
  report_formats: ["json", "csv", "md"]

# --- STEP 19: backend ---
api:
  host: "127.0.0.1"
  port: 8000

runtime:
  num_workers: 4
  log_level: "INFO"
